{% extends "base.html" %}
{% block title %}Add Item - Hirgal Kiro{% endblock %}
{% block content %}
<a class="text-sm font-semibold text-indigo-700" href="{% url 'web-inventory-report' %}">← Inventory</a>
<h1 class="mt-4 text-3xl font-bold text-ink">Add New Item</h1>
<p class="mt-2 text-slate-500">Add a new item to your property.</p>

<form method="post" class="mt-6 max-w-xl rounded-2xl border bg-white p-6 shadow-sm">
    {% csrf_token %}

    <div class="mb-4">
        <label class="block text-sm font-medium text-slate-700 mb-1">Property</label>
        <select name="property" required class="w-full rounded-lg border-slate-300 border p-2 text-sm">
            <option value="">-- Select Property --</option>
            {% for p in properties %}
            <option value="{{ p.pk }}">{{ p.name }}</option>
            {% endfor %}
        </select>
    </div>

    {{ form.as_p }}

    <div class="mt-4 flex gap-3">
        <button type="submit" class="rounded-lg bg-indigo-600 px-5 py-2 text-sm font-bold text-white hover:bg-indigo-700">Save</button>
        <a href="{% url 'web-inventory-report' %}" class="rounded-lg bg-slate-200 px-5 py-2 text-sm font-bold text-slate-700 hover:bg-slate-300">Go back</a>
    </div>
</form>
{% endblock %}
