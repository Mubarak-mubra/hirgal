{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto mt-10">
  <div class="rounded-xl border bg-white shadow-sm p-6">
    {% if editing %}
      <h1 class="text-xl font-semibold text-slate-800 mb-6">Wax ka beddel alaabta</h1>
    {% else %}
      <h1 class="text-xl font-semibold text-slate-800 mb-6">Ku dar alaabta {{ property.name }}</h1>
    {% endif %}

    <div class="mb-4">
      <label class="block text-sm font-medium text-slate-700">Hanti</label>
      <input type="text" value="{{ property.name }}" readonly class="mt-1 block w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-sm text-slate-500" />
    </div>

    <form method="POST">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="flex items-center gap-4 mt-6">
        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
          Kaydi
        </button>
        <a href="{% url 'web-property-detail' property.pk %}" class="px-4 py-2 rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-50 transition">
          Noqo
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
