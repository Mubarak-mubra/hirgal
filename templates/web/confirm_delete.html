{% extends "base.html" %}

{% block content %}
<div class="max-w-lg mx-auto p-6">
  <div class="bg-white rounded-xl border shadow-sm p-6">
    <h1 class="text-2xl font-bold mb-4">Delete</h1>
    <p class="text-gray-700 mb-6">Are you sure you want to delete: <strong>{{ object }}</strong>?</p>

    <form method="POST" action="">
      {% csrf_token %}
      <div class="flex gap-3">
        <button type="submit" class="bg-red-600 text-white px-6 py-2 rounded-lg hover:bg-red-700 transition font-bold">
          Yes, Delete
        </button>
        {% if cancel_url and cancel_args %}
        <a href="{% url cancel_url cancel_args.0 %}" class="border px-6 py-2 rounded-lg hover:bg-gray-50 transition">Cancel</a>
        {% elif cancel_url %}
        <a href="{% url cancel_url %}" class="border px-6 py-2 rounded-lg hover:bg-gray-50 transition">Cancel</a>
        {% else %}
        <a href="javascript:history.back()" class="border px-6 py-2 rounded-lg hover:bg-gray-50 transition">Cancel</a>
        {% endif %}
      </div>
    </form>
  </div>
</div>
{% endblock %}
